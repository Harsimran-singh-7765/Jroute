
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jroute Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    /* =========================================
       1. THEME CONFIGURATION & VARIABLES
       ========================================= */
    :root {
        /* --- DEFAULT THEME (AMBER - Your Original) --- */
        --primary: #ffbb33;          /* Main text */
        --glow: #ffaa33;             /* Borders & Light glow */
        --glow-strong: #ff8833;      /* Strong shadows */
        --glow-intense: #ff6633;     /* Intense highlights */
        --bg-overlay: rgba(40, 30, 0, 0.6); /* Semi-transparent backgrounds */
        --bg-dark: rgba(20, 15, 0, 0.6);    /* Chat window bg */
        --user-bg: rgba(40, 30, 0, 0.5);    /* Message bg */
        --own-bg: rgba(40, 40, 20, 0.5);    /* Own message bg */
        --own-border: #ffdd88;
        --screen-tint: #0d0d00;      /* The subtle tint of the black screen */
        --scanline-color: rgba(0, 0, 0, 0.2);
    }

    /* --- THEME: CYBER (Purple/Pink) --- */
    [data-theme="cyber"] {
        --primary: #e056fd;
        --glow: #be2edd;
        --glow-strong: #8e44ad;
        --glow-intense: #ff00ff;
        --bg-overlay: rgba(40, 0, 40, 0.6);
        --bg-dark: rgba(20, 0, 20, 0.6);
        --user-bg: rgba(40, 0, 40, 0.5);
        --own-bg: rgba(60, 20, 60, 0.5);
        --own-border: #ff9ff3;
        --screen-tint: #110011;
    }

    /* --- THEME: RIOT (Red/Aggressive) --- */
    [data-theme="riot"] {
        --primary: #eb4d4b;
        --glow: #ff0000;
        --glow-strong: #c0392b;
        --glow-intense: #ff3333;
        --bg-overlay: rgba(40, 0, 0, 0.6);
        --bg-dark: rgba(20, 0, 0, 0.6);
        --user-bg: rgba(40, 10, 10, 0.5);
        --own-bg: rgba(60, 10, 10, 0.5);
        --own-border: #ff7979;
        --screen-tint: #110000;
    }

    /* --- THEME: DOCKER (Blue/Cyan) --- */
    [data-theme="docker"] {
        --primary: #48dbfb;
        --glow: #0abde3;
        --glow-strong: #2980b9;
        --glow-intense: #00d2d3;
        --bg-overlay: rgba(0, 30, 40, 0.6);
        --bg-dark: rgba(0, 15, 20, 0.6);
        --user-bg: rgba(0, 30, 40, 0.5);
        --own-bg: rgba(0, 40, 50, 0.5);
        --own-border: #7efff5;
        --screen-tint: #000d11;
    }

    /* --- THEME: HACKER (Matrix Green) --- */
    [data-theme="hacker"] {
        --primary: #2ecc71;
        --glow: #00b894;
        --glow-strong: #006266;
        --glow-intense: #55efc4;
        --bg-overlay: rgba(0, 40, 0, 0.6);
        --bg-dark: rgba(0, 20, 0, 0.6);
        --user-bg: rgba(0, 40, 10, 0.5);
        --own-bg: rgba(10, 50, 20, 0.5);
        --own-border: #b8e994;
        --screen-tint: #000f00;
    }

    /* =========================================
       2. VIEW TRANSITION ANIMATION (The Ripple)
       ========================================= */
    
    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
    }

    /* The old screen sits behind */
    ::view-transition-old(root) {
        z-index: 1;
    }

    /* The new screen ripples on top */
    ::view-transition-new(root) {
        z-index: 999;
        /* The animation matches the "Theme Select" button position roughly */
        animation: theme-ripple 4.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes theme-ripple {
        0% {
            clip-path: circle(0% at 85% 12%); /* Starts near the selector */
        }
        100% {
            clip-path: circle(150% at 85% 12%); /* Expands to cover screen */
        }
    }

    /* =========================================
       3. YOUR ORIGINAL CSS (Refactored with Vars)
       ========================================= */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'VT323', monospace;
        background: #0a0a0a;
        color: var(--primary); /* VAR */
        overflow: hidden;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Monitor Chassis - Heavy Bezel (Kept dark grays static, they don't change) */
    #monitor-chassis {
        width: 90vw; height: 90vh;
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a, #0d0d0d);
        border-radius: 40px 40px 50px 50px;
        padding: 50px 40px 60px 40px;
        box-shadow: 
            0 30px 100px rgba(0, 0, 0, 0.9),
            inset 0 5px 20px rgba(255, 255, 255, 0.1),
            inset 0 -10px 30px rgba(0, 0, 0, 0.8);
        position: relative;
        border: 5px solid #1a1a1a;
    }

    #monitor-chassis::before {
        content: ''; position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px;
        border: 2px solid #333; border-radius: 35px 35px 45px 45px; pointer-events: none;
    }

    /* CRT Screen with Glass Bulge Effect */
    #crt-screen {
        width: 100%; height: 100%;
        /* VAR: Uses screen-tint for the subtle background color change */
        background: radial-gradient(ellipse at center, var(--screen-tint) 0%, #000000 100%);
        border-radius: 25px; position: relative; overflow: hidden;
        /* VAR: Inner glow color matches theme */
        box-shadow: 
            inset 0 0 150px var(--bg-overlay),
            inset 20px 20px 100px rgba(0, 0, 0, 0.8),
            inset -20px -20px 100px rgba(0, 0, 0, 0.8),
            0 0 50px rgba(var(--primary), 0.1);
        border: 10px solid #0d0d0d;
        transform: perspective(1200px) rotateX(0deg);
        transform-style: preserve-3d;
        animation: flicker 0.2s infinite;
    }

    /* (Keeping your decorative pseudo-elements exactly as they were) */
    #crt-screen::before {
        content: ''; position: absolute; top: -10%; left: -10%; right: -10%; bottom: -10%;
        background: radial-gradient(ellipse at 45% 40%, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
        pointer-events: none; z-index: 15;
    }
    #glass-reflection {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 30%, transparent 70%, rgba(255, 255, 255, 0.05) 100%);
        pointer-events: none; z-index: 14;
    }
    #bulge-warp {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0, 0, 0, 0.3) 80%, rgba(0, 0, 0, 0.6) 100%);
        pointer-events: none; z-index: 13; transform: scale(1.05);
    }
    #screen-content {
        width: 100%; height: 100%; padding: 25px; position: relative; z-index: 2;
        display: flex; flex-direction: column; transform: scale(0.98);
    }

    /* Scanlines */
    #scanlines {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        /* VAR: Scanline color */
        background: repeating-linear-gradient(0deg, var(--scanline-color) 0px, var(--scanline-color) 1px, transparent 1px, transparent 2px);
        pointer-events: none; z-index: 12; animation: scanlineMove 10s linear infinite;
    }
    @keyframes scanlineMove { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

    #vignette {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(ellipse at center, transparent 0%, transparent 30%, rgba(0, 0, 0, 0.4) 60%, rgba(0, 0, 0, 0.8) 85%, rgba(0, 0, 0, 0.95) 100%);
        pointer-events: none; z-index: 11;
    }

    /* CRT Phosphor Glow */
    #crt-glow {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        /* VAR: The glow follows the primary theme color */
        background: radial-gradient(ellipse at 48% 45%, var(--bg-overlay) 0%, transparent 70%);
        pointer-events: none; z-index: 10; animation: glowPulse 5s ease-in-out infinite;
    }
    @keyframes glowPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes flicker { 0% { opacity: 0.97; } 3% { opacity: 0.92; } 6% { opacity: 1; } 7% { opacity: 0.95; } 8% { opacity: 0.98; } 10% { opacity: 0.96; } 100% { opacity: 0.98; } }
    
    #glitch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; opacity: 0.4; }

    /* Header */
    #terminal-header {
        background: var(--bg-overlay); /* VAR */
        border: 3px solid var(--glow); /* VAR */
        padding: 18px 25px; margin-bottom: 20px;
        box-shadow: 0 0 30px var(--bg-overlay), inset 0 0 30px rgba(0, 0, 0, 0.8);
        display: flex; justify-content: space-between; align-items: center; font-size: 1.2em;
    }

    #terminal-title {
        font-family: 'Press Start 2P', cursive; font-size: 1.6em;
        color: var(--primary); /* VAR */
        text-shadow: 0 0 15px var(--glow), 0 0 30px var(--glow), 0 0 45px var(--glow-strong); /* VARS */
        letter-spacing: 4px; animation: titleGlow 3s ease-in-out infinite;
    }

    @keyframes titleGlow {
        0%, 100% { text-shadow: 0 0 15px var(--glow), 0 0 30px var(--glow), 0 0 45px var(--glow-strong); }
        50% { text-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow), 0 0 60px var(--glow-strong), 0 0 80px var(--glow-intense); }
    }

    /* NEW: Theme Select Styling */
    .header-controls { display: flex; gap: 15px; align-items: center; }
    
    select#theme-select {
        background: rgba(0,0,0,0.8); color: var(--primary);
        border: 2px solid var(--glow);
        font-family: 'VT323', monospace; font-size: 1em;
        padding: 8px; cursor: pointer; outline: none;
        box-shadow: 0 0 15px var(--bg-overlay);
        text-transform: uppercase;
    }
    select#theme-select option { background: #000; color: var(--primary); }

    #online-users {
        font-size: 1.2em; color: var(--primary); /* VAR */
        text-shadow: 0 0 15px var(--glow); /* VAR */
        background: rgba(0, 0, 0, 0.8); padding: 10px 18px;
        border: 2px solid var(--glow); /* VAR */
        box-shadow: 0 0 20px var(--bg-overlay); /* VAR */
    }

    /* Chat Window */
    #chat-window {
        flex: 1; background: var(--bg-dark); /* VAR */
        border: 3px solid var(--glow); /* VAR */
        padding: 20px; margin-bottom: 20px; overflow-y: auto;
        box-shadow: 0 0 40px var(--bg-overlay), inset 0 0 80px rgba(0, 0, 0, 0.9);
        position: relative;
    }

    /* Scrollbar logic updated for vars */
    #chat-window::-webkit-scrollbar { width: 12px; }
    #chat-window::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.9); border: 1px solid var(--glow); }
    #chat-window::-webkit-scrollbar-thumb { background: var(--glow); border: 1px solid var(--primary); box-shadow: 0 0 15px var(--glow); }

    #messages { display: flex; flex-direction: column; gap: 15px; }

    .message-item {
        background: var(--user-bg); /* VAR */
        border-left: 4px solid var(--glow); /* VAR */
        padding: 12px 18px; box-shadow: 0 0 20px rgba(0,0,0,0.2);
        animation: messageAppear 0.4s ease-out; font-size: 1.3em; line-height: 1.5;
        color: var(--primary);
    }

    @keyframes messageAppear { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

    .message-item.own {
        background: var(--own-bg); /* VAR */
        border-left-color: var(--own-border); /* VAR */
        align-self: flex-end; max-width: 80%;
    }

    /* Keep these specific colors for Join/Leave/Error as they are standard system alerts */
    .message-item.join { background: rgba(30, 40, 20, 0.4); border-left-color: #99ff66; text-align: center; font-style: italic; color: #99ff66; text-shadow: 0 0 10px #99ff66; }
    .message-item.leave { background: rgba(40, 30, 20, 0.4); border-left-color: #ffaa66; text-align: center; font-style: italic; color: #ffaa66; text-shadow: 0 0 10px #ffaa66; }
    .message-item.error { background: rgba(40, 20, 0, 0.5); border-left-color: #ff6633; text-align: center; color: #ff8866; text-shadow: 0 0 15px #ff6633; }

    .message-meta { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 12px; }
    
    .message-name { color: var(--primary); font-weight: bold; text-shadow: 0 0 10px var(--glow); }
    .message-item.own .message-name { color: var(--own-border); text-shadow: 0 0 10px var(--glow); }
    
    .message-timestamp { color: var(--primary); opacity: 0.6; font-size: 0.9em; }
    
    .message-text { color: var(--primary); text-shadow: 0 0 5px var(--glow); word-wrap: break-word; }
    .message-item.own .message-text { color: var(--own-border); text-shadow: 0 0 5px var(--glow); }

    /* Input Footer */
    #terminal-footer {
        background: var(--bg-overlay); /* VAR */
        border: 3px solid var(--glow); /* VAR */
        padding: 12px; box-shadow: 0 0 30px var(--bg-overlay), inset 0 0 30px rgba(0, 0, 0, 0.8);
        display: flex; align-items: center; gap: 12px;
    }

    #prompt-symbol { color: var(--primary); font-size: 1.4em; text-shadow: 0 0 15px var(--glow); white-space: nowrap; }

    #msgBox {
        flex: 1; background: rgba(0, 0, 0, 0.9);
        border: 2px solid var(--glow); /* VAR */
        padding: 14px 18px; font-family: 'VT323', monospace; font-size: 1.4em;
        color: var(--primary); outline: none;
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px var(--bg-overlay);
        text-shadow: 0 0 8px var(--glow);
    }
    #msgBox::placeholder { color: var(--primary); opacity: 0.4; }
    #msgBox:focus { box-shadow: 0 0 30px var(--bg-overlay), inset 0 0 40px rgba(100, 50, 0, 0.3); border-color: var(--primary); }
    #msgBox:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Cursor */
    .cursor { display: inline-block; width: 12px; height: 22px; background: var(--primary); animation: cursorBlink 1s infinite; box-shadow: 0 0 15px var(--glow); }
    @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    /* Power LED - matches theme */
    #power-led {
        position: absolute; bottom: 20px; right: 20px; width: 15px; height: 15px;
        background: var(--glow); border-radius: 50%;
        box-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow), 0 0 60px var(--glow-strong);
        animation: ledPulse 2.5s infinite;
    }
    @keyframes ledPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    #brand-label {
        position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
        font-family: 'Press Start 2P', cursive; font-size: 0.7em; color: #666; letter-spacing: 2px;
    }

    /* Upload Button */
    #upload-btn {
        background: var(--glow); color: #0a0a0a;
        border: 2px solid var(--primary); padding: 10px 12px; cursor: pointer;
        font-family: 'VT323', monospace; font-size: 1.2em; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 15px var(--glow); transition: all 0.2s; margin-left: 10px;
    }
    #upload-btn:hover { background: var(--primary); color: #0a0a0a; box-shadow: 0 0 25px var(--primary); }
    #upload-btn:active { transform: scale(0.95); }
    #upload-btn svg { display: block; }
    
    .download-link {
        color: #99ff66; text-decoration: none; font-weight: bold;
        background: rgba(0, 0, 0, 0.5); padding: 4px 8px; border: 1px solid #99ff66;
        text-shadow: 0 0 10px #99ff66; display: inline-block; margin-top: 8px;
    }
    .download-link:hover { background: #99ff66; color: #0a0a0a; text-shadow: none; }

    @media (max-width: 768px) {
        #terminal-title { font-size: 1.1em; }
        .message-item { font-size: 1.1em; }
    }
</style>
</head>
<body>
    <div id="monitor-chassis">
        <div id="crt-screen">
            <!-- Glass and Effects Layers -->
            <div id="glass-reflection"></div>
            <div id="bulge-warp"></div>
            <div id="vignette"></div>
            <div id="crt-glow"></div>
            <div id="scanlines"></div>
            <canvas id="glitch-canvas"></canvas>
            
            <!-- Screen Content -->
            <div id="screen-content">
                <div id="terminal-header">
                    <div id="terminal-title">JROUTE™ </div>
                    <div class="header-controls">
                        <select id="theme-select">
                            <option value="amber">AMBER</option>
                            <option value="cyber">CYBER</option>
                            <option value="riot">RIOT</option>
                            <option value="docker">DOCKER</option>
                            <option value="hacker">HACKER</option>
                        </select>
                        <div id="online-users">ONLINE: 0</div>
                    </div>
                </div>
                                
                <div id="chat-window">
                    <div id="messages">
                        <!-- Messages will be injected here -->
                    </div>
                </div>
                
                <div id="terminal-footer">
                    <div id="prompt-symbol">user@jroute:~$<span class="cursor"></span></div>
                    <input 
                        id="msgBox" 
                        placeholder="Type message..." 
                        autocomplete="off"
                    />
                    
                    <!-- ADDED THESE TWO LINES BACK IN -->
                    <button id="upload-btn" title="Upload File">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20px" height="20px">
                            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zM9.75 12.75L12 10.5l2.25 2.25M12 3v9.75M6.375 12c.536 0 1.026.23 1.372.605l.314.413c.44.575 1.01.08 1.64.494l.36.238c.68.42 1.3.625 1.94.625s1.26-.205 1.94-.625l.36-.238c.63-.412 1.2-.919 1.64-1.494l.314-.413c.346-.375.835-.605 1.37-.605 1.036 0 1.875.84 1.875 1.875v.5c0 .621-.504 1.125-1.125 1.125h-9.75C6.504 15 6 14.496 6 13.875v-.5C6 12.84 6.84 12 7.875 12h-1.5z" />
                        </svg>
                    </button>
                    <input type="file" id="file-input" style="display: none;" />

                </div>
            </div>
        </div>
        <div id="power-led"></div>
        <div id="brand-label">
            <span style="font-size: 0.9em; letter-spacing: 3px;">━━━</span> 
            JROUTE™ 
            <span style="font-size: 0.9em; letter-spacing: 3px;">━━━</span>
        </div>
    </div>

<script>
    // --- 1. NICKNAME LOGIC ---
    let userNickname = sessionStorage.getItem('jroute_nickname');
    
    if (!userNickname) {
        while (!userNickname || userNickname.trim() === "") {
            userNickname = prompt("Please enter your nickname:");
            if (userNickname === null) {
                document.body.innerHTML = "<h1 style='color: var(--primary); text-align: center; margin-top: 20vh; font-family: VT323;'>Please refresh and enter a nickname to join the chat.</h1>";
                throw new Error("Nickname required");
            }
        }
        sessionStorage.setItem('jroute_nickname', userNickname.trim());
    }
    
    // --- 2. AUTO-SCROLL OBSERVER ---
    const chatWindow = document.getElementById('chat-window');
    const messagesContainer = document.getElementById('messages');
    
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.addedNodes.length) {
                chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
            }
        });
    });
    
    observer.observe(messagesContainer, { childList: true, subtree: true });

    // --- 3. DYNAMIC GLITCH EFFECT (THEME AWARE) ---
    const canvas = document.getElementById('glitch-canvas');
    const ctx = canvas.getContext('2d');
    
    // Default colors (will be overwritten by CSS vars)
    let glitchPrimary = '#ffbb33'; 
    let glitchStrong = '#ff8833';

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Function to read current CSS variables
    function updateGlitchColors() {
        const styles = getComputedStyle(document.documentElement);
        // .trim() is important to remove whitespace from CSS var
        glitchPrimary = styles.getPropertyValue('--primary').trim();
        glitchStrong = styles.getPropertyValue('--glow-strong').trim();
    }

    function drawGlitch() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Random glitch occurrence
        if (Math.random() > 0.96) {
            const glitchHeight = Math.random() * 60 + 30;
            const glitchY = Math.random() * canvas.height;
            
            // Layer 1: Strong Glow (Background block)
            ctx.globalAlpha = 0.4; 
            ctx.fillStyle = glitchStrong; 
            ctx.fillRect(0, glitchY, canvas.width, glitchHeight);
            
            // Layer 2: Primary Color (Offset block)
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = glitchPrimary;
            ctx.fillRect(Math.random() * 15 - 7, glitchY, canvas.width, glitchHeight);
            
            // Layer 3: Detail Line
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = glitchStrong;
            ctx.fillRect(Math.random() * 15 - 7, glitchY, canvas.width, glitchHeight);
            
            // Reset Alpha so we don't mess up future draws
            ctx.globalAlpha = 1.0;
        }
        
        // Random Noise Particles
        if (Math.random() > 0.93) {
            for (let i = 0; i < 30; i++) {
                // Random opacity for each particle
                ctx.globalAlpha = Math.random() * 0.4;
                ctx.fillStyle = glitchPrimary;
                ctx.fillRect(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    Math.random() * 120,
                    Math.random() * 4
                );
            }
            ctx.globalAlpha = 1.0; // Reset
        }
    }

    // Initialize colors immediately
    updateGlitchColors();
    setInterval(drawGlitch, 60);

    // --- 4. SCREEN SHAKE & CRT EFFECTS ---
    setInterval(() => {
        if (Math.random() > 0.97) {
            const screen = document.getElementById('crt-screen');
            const xRot = Math.random() * 3 - 1.5;
            const yRot = Math.random() * 3 - 1.5;
            const xTrans = Math.random() * 6 - 3;
            screen.style.transform = `perspective(1200px) rotateX(${xRot}deg) rotateY(${yRot}deg) translateX(${xTrans}px)`;
            setTimeout(() => {
                screen.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg)';
            }, 150);
        }
    }, 300);

    // Phosphor afterglow
    let lastBrightness = 0.98;
    setInterval(() => {
        lastBrightness = 0.95 + Math.random() * 0.05;
        document.getElementById('crt-screen').style.opacity = lastBrightness;
    }, 100);

    // --- 5. THEME SWITCHER LOGIC (RIPPLE EFFECT) ---
    const themeSelect = document.getElementById('theme-select');
    
    // Load Saved Theme
    const savedTheme = localStorage.getItem('jroute_theme') || 'amber';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if(themeSelect) themeSelect.value = savedTheme;
    
    // Update glitch colors after loading saved theme
    updateGlitchColors();

    // Handle Change
    if(themeSelect) {
        themeSelect.addEventListener('change', (e) => {
            const newTheme = e.target.value;
            
            // Fallback
            if (!document.startViewTransition) {
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('jroute_theme', newTheme);
                updateGlitchColors(); // Update canvas colors immediately
                return;
            }

            // Ripple Transition
            document.startViewTransition(() => {
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('jroute_theme', newTheme);
                updateGlitchColors(); // Update canvas colors during transition
            });
        });
    }
</script>
<script src="script.js"></script>
</body>
</html>
